- type: entity
  parent: BaseAction
  id: ActionOperativeHiddenTouch
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 180
    itemIconStyle: NoItem
    priority: 12
  - type: Sprite
    sprite: _Whiskey/OperativeHidden/Actions/scp049.rsi
    layers:
    - state: kill
  - type: TargetAction
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:OperativeHiddenTriclorActionEvent

