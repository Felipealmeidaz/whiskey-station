- type: entity
  parent: BaseAction
  id: ActionOperativeHiddenTouch
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0
    itemIconStyle: NoItem
    priority: 12
  - type: Sprite
    sprite: Whiskey/OperativeHidden/Actions/scp049.rsi
    layers:
    - state: kill
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:NativeAntagTargetActionEvent
      eventType: 4

