- type: combo
  id: PushKick
  attacks:
  - Grab
  - Harm
  - Harm
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit3.ogg
  opponentEffects:
  - !type:ModifyKnockdown
    time: 1
    drop: false
  - !type:HealthChange
    targetPart: Chest
    damage:
      types:
        Blunt: 5
  - !type:StopPull
  - !type:GrabThrow
    dropItems: false
  levelRequired: 10

- type: combo
  id: CircleKick
  attacks:
  - Disarm
  - Disarm
  - Harm
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit2.ogg
  opponentEffects:
  - !type:HealthChange
    targetPart: Chest
    damage:
      types:
        Blunt: 15
  - !type:ModifyStatusEffect
    effectProto: CircleKickSlowdownStatusEffect
    time: 5
  levelRequired: 10

- type: combo
  id: SweepKick
  attacks:
  - Harm
  - Harm
  - Disarm
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit1.ogg
  opponentEffects:
  - !type:HealthChange
    targetPart: Chest
    damage:
      types:
        Blunt: 10
  - !type:ModifyKnockdown
    time: 1
    drop: false
  - !type:TakeStaminaDamage
    amount: 10
  levelRequired: 10

- type: combo
  id: SpinKick
  attacks:
  - Grab
  - Harm
  - Disarm
  - Harm
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit1.ogg
  opponentEffects:
  - !type:HealthChange
    targetPart: Chest
    damage:
      types:
        Blunt: 25
  - !type:ModifyKnockdown
    time: 2
    drop: false
  - !type:TakeStaminaDamage
    amount: 15
  levelRequired: 10

- type: combo
  id: KickUp
  attacks:
  - Disarm
  - Disarm
  userConditions:
  - !type:StandingCondition
    inverted: true
  conditions:
  - !type:SelfTargetCondition
  userEffects:
  - !type:RemoveComponents
    components:
    - type: KnockedDown
  - !type:SetStanding
    standing: true
    force: true
  giveExperience: false
  levelRequired: 10
