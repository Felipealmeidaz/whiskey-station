# WhiteDream - the leader's rune, and only once the veil has already been torn.
- type: runeSelector
  id: CultRuneApocalypse
  prototype: CultRuneApocalypse
  requireLeader: true
  requireVeilWeakened: true
  drawTime: 30
  drawDamage:
    types:
      Slash: 20

# WhiteDream - unlocks at the pentagram stage (BloodCultRuleComponent.PentagramThreshold), keep in sync.
- type: runeSelector
  id: CultRuneDimensionalRending
  prototype: CultRuneDimensionalRending
  requireTargetDead: true
  # Whiskey - tearing the veil is the final stage of the cult's growth and now matches the
  # unavoidable pentagram threshold. 60 players = 24 cultists, 30 = 12, 15 = 6.
  # The sacrifice objective still gates it as well.
  requireLeader: true
  requiredCultistsPercent: 0.4
  drawTime: 40
  drawDamage:
    types:
      Slash: 50
