# Whiskey: o parent precisa ser o BaseAntagSpawner, que traz o
# GhostRoleAntagSpawner. O AntagSelectionSystem exige esse componente no
# spawnerPrototype do antagSpecifier, e sem ele apaga o spawner e registra erro.
# Quem cria o corpo é o AntagLoadProfileRule da BaseBrighteyeRule, com
# speciesHardOverride Shadekin, e não um mob fixo.
- type: entity
  id: SpawnPointGhostBrighteye
  name: ghost role spawn point
  suffix: brighteye
  parent: BaseAntagSpawner
  components:
  - type: GhostRole
    name: roles-antag-brighteye-name
    description: roles-antag-brighteye-description
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleBrighteye
    raffle:
      settings: default

# Whiskey: ponto de nascimento usado pelos mapas da escuridão. Diferente do
# SpawnPointGhostBrighteye acima, que é a vaga de ghost role: este aqui é só o
# marcador de onde o Brighteye aparece dentro do mapa.
- type: entity
  id: SpawnPointBrighteye
  parent: MarkerBase
  name: brighteye
  components:
  - type: SpawnPoint
  - type: Sprite
    layers:
    - state: green
    - sprite: _Starlight/Mobs/Species/Shadekin/parts.rsi
      state: full
