name: Build & Test Debug

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  build:
    if: github.actor != 'SlopBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - &checkout
      name: Checkout Master
      uses: actions/checkout@v7

    - &submodule
      name: Setup Submodule
      run: git submodule update --init --recursive

    - &submodule_pull
      name: Pull engine updates
      uses: Trauma-Station/submodule-dependency@v0.2.2
      with:
        map: |
          {
            "QuietToolbox": "RobustToolbox"
          }

    - &submodule_update
      name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    # <Trauma>
    - &native_dependencies
      name: Install native build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm
    # </Trauma>

    - &restore
      name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Save build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        # <Trauma> Retain the native runtime consumed by downloaded integration-test jobs.
        path: |
          bin/Content.*/*.json
          bin/Content.IntegrationTests/*.dll
          bin/Content.IntegrationTests/*.pdb
          bin/Content.IntegrationTests/libwhiskey_operativo_oculto.so
          bin/Content.IntegrationTests/runtimes/linux-x64/**
          bin/Content.MapRenderer/*.dll
          bin/Content.MapRenderer/*.pdb
          bin/Content.Tests/*.dll
        # </Trauma>
        retention-days: 1

  build-release:
    needs: build # just to not run it if it fails on debug, doesnt actually need it
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - *checkout
    - *submodule
    - *submodule_pull
    - *submodule_update
    - *native_dependencies # Trauma - required by the Hidden Operative native runtime.
    - *restore
    - name: Build Project
      run: dotnet build --configuration Release --no-restore /m

  # Run Content.Tests unit tests separately, nothing depends on them so it's quick (~2 mins total)
  test-unit:
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - *checkout
    - *submodule
    - *submodule_pull
    - *submodule_update
    - &download_build
      name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: bin/

    - name: Link runtimes
      run: ln -s $(pwd)/bin/Content.IntegrationTests/runtimes bin/Content.Tests/

    - name: Run Content.Tests
      run: dotnet test bin/Content.Tests/Content.Tests.dll -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    # never seen it fail once IDC about archiving it

  # Run every test that doesnt have a [Category] set
  test-main:
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - *checkout
    - *submodule
    - *submodule_pull
    - *submodule_update
    - *download_build

    - name: Run main Content.IntegrationTests
      run: |
        DOTNET_gcServer=1 dotnet test bin/Content.IntegrationTests/Content.IntegrationTests.dll -- \
          NUnit.Where="cat != MapTests && cat != GameRuleTests" \
          NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Archive NUnit3 test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-main-${{ github.run_attempt }}
        path: test_results/*
        retention-days: 7
        compression-level: 9

  # <Trauma>
  # Keep the native antag fixture independently observable. The aggregate main
  # suite currently contains unrelated baseline failures and may hit its timeout.
  test-operative-hidden:
    name: Hidden Operative (Linux x64)
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - *checkout
    - *submodule
    - *submodule_pull
    - *submodule_update
    - *download_build

    - name: Verify Hidden Operative native runtime artifact
      run: |
        test -s bin/Content.IntegrationTests/libwhiskey_operativo_oculto.so
        file bin/Content.IntegrationTests/libwhiskey_operativo_oculto.so
        sha256sum bin/Content.IntegrationTests/libwhiskey_operativo_oculto.so

    - name: Run Hidden Operative integration fixture
      run: |
        DOTNET_gcServer=1 dotnet test bin/Content.IntegrationTests/Content.IntegrationTests.dll \
          --logger "console;verbosity=detailed" -- \
          NUnit.Where="class == Content.IntegrationTests.Tests.Whiskey.OperativeHiddenTest" \
          NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Archive Hidden Operative NUnit3 results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-operative-hidden-${{ github.run_attempt }}
        path: test_results/*
        retention-days: 7
        compression-level: 9
  # </Trauma>

  # Test all the map tests seperately
  # Any test with Category("MapTests") is used
  test-maps:
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
    - *checkout
    - *submodule
    - *submodule_pull
    - *submodule_update
    - *download_build

    - name: Run MapTests
      run: |
        DOTNET_gcServer=1 dotnet test bin/Content.IntegrationTests/Content.IntegrationTests.dll -- \
          NUnit.Where="cat == MapTests" \
          NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Archive NUnit3 test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-maps-${{ github.run_attempt }}
        path: test_results/*
        retention-days: 7
        compression-level: 9

  # Test all the gamerule tests seperately
  # Any test with Category("GameRuleTests") is used
  test-gamerules:
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
    - *checkout
    - *submodule
    - *submodule_pull
    - *submodule_update
    - *download_build

    - name: Run GameRuleTests
      run: |
        DOTNET_gcServer=1 dotnet test bin/Content.IntegrationTests/Content.IntegrationTests.dll -- \
          NUnit.Where="cat == GameRuleTests" \
          NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Archive NUnit3 test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-gamerules-${{ github.run_attempt }}
        path: test_results/*
        retention-days: 7
        compression-level: 9

  test-map-render:
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
    - *checkout
    - *submodule
    - *submodule_pull
    - *submodule_update
    - *download_build

    - name: Link runtimes
      run: ln -s $(pwd)/bin/Content.IntegrationTests/runtimes bin/Content.MapRenderer/

    - name: Run Map Renderer
      run: dotnet exec bin/Content.MapRenderer/Content.MapRenderer.dll Dev

  ci-success:
    name: Build & Test Debug
    # <Trauma> The native antag fixture is a required, independently visible Linux check.
    needs: [build, build-release, test-unit, test-main, test-operative-hidden, test-maps, test-gamerules, test-map-render]
    # </Trauma>
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: CI succeeded
        run: |
          if [[ "${{ needs.build.result }}" != "success" ||
                "${{ needs.build-release.result }}" != "success" ||
                "${{ needs.test-unit.result }}" != "success" ||
                "${{ needs.test-main.result }}" != "success" ||
                "${{ needs.test-operative-hidden.result }}" != "success" ||
                "${{ needs.test-maps.result }}" != "success" ||
                "${{ needs.test-gamerules.result }}" != "success" ||
                "${{ needs.test-map-render.result }}" != "success" ]]; then
            echo "Not all tests succeeded!"
            exit 1
          fi
          exit 0
